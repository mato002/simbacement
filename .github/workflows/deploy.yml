name: Deploy Laravel via FTP

on:
  push:
    branches:
      - main  # Change this to 'master' if your main branch is master

jobs:
  web-deploy:
    name: Build & Sync Project Files
    runs-on: ubuntu-latest
    steps:
    - name: Get Latest Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4' # Locked packages require PHP >= 8.4.1
        extensions: mbstring, xml, ctype, iconv, mysql, zip

    - name: Install Composer Dependencies
      run: |
        composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Build Frontend Assets
      run: |
        npm ci
        npm run build

    - name: Sync Production Files to Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ./
        timeout: 600000
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/node_modules/**
          **/tests/**
          **/phpunit.xml
          **/.env
          **/.env.*
          !**/.env.example
          **/.editorconfig
          **/.styleci.yml
          **/README.md
          **/CHANGELOG.md
          **/*.md
          **/package.json
          **/package-lock.json
          **/vite.config.*
          **/tailwind.config.*
          **/postcss.config.*
          **/storage/logs/**
          **/storage/framework/cache/**
          **/storage/framework/sessions/**
          **/storage/framework/views/**
          **/storage/pail/**
