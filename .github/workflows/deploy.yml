name: Deploy Laravel via FTP

on:
  push:
    branches:
      - main  # Change this to 'master' if your main branch is master

jobs:
  web-deploy:
    name: Build & Sync Project Files
    runs-on: ubuntu-latest
    steps:
    - name: Get Latest Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Build Frontend Assets
      run: |
        npm ci
        npm run build

    - name: Sync Production Files to Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ./
        timeout: 600000
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/node_modules/**
          **/vendor/**
          **/vendor.zip
          **/composer.json
          **/composer.lock
          **/tests/**
          **/phpunit.xml
          **/.env
          **/.env.*
          !**/.env.example
          **/.editorconfig
          **/.styleci.yml
          **/README.md
          **/CHANGELOG.md
          **/*.md
          **/package.json
          **/package-lock.json
          **/vite.config.*
          **/tailwind.config.*
          **/postcss.config.*
          **/storage/logs/**
          **/storage/framework/cache/**
          **/storage/framework/sessions/**
          **/storage/framework/views/**
          **/storage/pail/**

    # 6. Sync Compiled Vite Assets directly to public_html/
    - name: Deploy Assets to public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: public/
        server-dir: public_html/
        timeout: 600000
        exclude: |
          hot
          storage
          .htaccess
          index.php
